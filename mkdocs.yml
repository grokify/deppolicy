site_name: DepPolicy
site_description: Statically analyzable dependency-policy engine — OpenFGA for code dependencies
site_url: https://grokify.github.io/deppolicy/
repo_url: https://github.com/grokify/deppolicy
repo_name: grokify/deppolicy

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts:
      - Component Model: concepts/model.md
      - Policy Documents: concepts/policy.md
      - Tiers: concepts/tiers.md
      - Evaluation: concepts/evaluation.md
  - Guides:
      - Bootstrapping an Ecosystem: guides/bootstrap.md
      - CI Enforcement: guides/ci.md
      - Fleet Scanning: guides/fleet.md
      - Editor and Vet Integration: guides/analyzer.md
      - Reports and Visualization: guides/reports.md
  - Reference:
      - Commands: reference/commands.md
      - Extending Beyond Go: reference/extending.md
      - Specification: https://github.com/grokify/deppolicy/blob/main/SPEC.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grokify/deppolicy

copyright: Copyright &copy; 2026 John Wang
